<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="ff-logo-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="48%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="ff-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle rounded badge with Fireflies brand gradient -->
  <rect width="32" height="32" rx="8" ry="8" fill="url(#ff-logo-grad)" />

  <!-- White AI Sparkle / Fireflies Luminary Mark -->
  <g filter="url(#ff-glow)">
    <!-- Primary 4-pointed radiant sparkle -->
    <path
      d="M 16 6 C 16 11.5 11.5 16 6 16 C 11.5 16 16 20.5 16 26 C 16 20.5 20.5 16 26 16 C 20.5 16 16 11.5 16 6 Z"
      fill="#FFFFFF"
    />
    <!-- Secondary accent sparkle -->
    <path
      d="M 24 5 C 24 6.8 22.2 8 21 8 C 22.2 8 24 9.2 24 11 C 24 9.2 25.8 8 27 8 C 25.8 8 24 6.8 24 5 Z"
      fill="#FFFFFF"
      opacity="0.95"
    />
    <!-- Ambient micro glow spark -->
    <circle cx="8.5" cy="8.5" r="1.2" fill="#FFFFFF" opacity="0.85" />
  </g>
</svg>
